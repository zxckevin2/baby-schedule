<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#7aa83a" />
  <title>宝宝作息</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-blobs"></div>

  <header class="app-header">
    <div class="header-title">宝宝作息</div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <main id="main">
    <section class="page active" id="page-schedule"></section>
    <section class="page" id="page-edu"></section>
    <section class="page" id="page-notes"></section>
  </main>

  <button class="fab" id="fabSleep" type="button" aria-label="哄睡">🌙</button>

  <nav class="tabbar">
    <button class="tab active" data-tab="schedule" type="button"><span class="tab-ico">📋</span><span class="tab-txt">作息</span></button>
    <button class="tab" data-tab="edu" type="button"><span class="tab-ico">🧩</span><span class="tab-txt">早教</span></button>
    <button class="tab" data-tab="notes" type="button"><span class="tab-ico">💡</span><span class="tab-txt">带养</span></button>
  </nav>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
